[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-edge-research"
version = "0.1.0"
description = "Uncertainty-Aware Grid-Edge Control: Probabilistic Load/PV Forecasting and Risk-Constrained Battery-Smart-Inverter Coordination on an Unbalanced Distribution Feeder"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Power Systems & Grid Edge Intelligence Research Group" }
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "cvxpy>=1.4.0",
    "pvlib>=0.10.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "PyYAML>=6.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0",
    "OpenDSSDirect.py>=0.9.0",
    "pyarrow>=14.0.0",
    "clarabel>=0.6.0",
    "osqp>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring OpenDSS or external files",
    "regression: Regression and end-to-end pipeline smoke tests",
]
